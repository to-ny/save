# Quick Smoke Test Profile
# Fast validation test for CI/PR checks
# Duration: 30 seconds, 10 concurrent users

[target]
endpoint = "http://localhost:9000"
access_key = "test-access-key"
secret_key = "test-secret-key"
bucket = "loadtest"

[workload]
duration_secs = 30

[workload.object_sizes]
small_1kb_percent = 50
medium_1mb_percent = 40
large_10mb_percent = 10
xlarge_100mb_percent = 0

[workload.users]
start = 1
max = 10
hatch_rate = 5

[scenarios.read_heavy]
put_weight = 1
get_weight = 8
delete_weight = 1
list_weight = 1

[scenarios.write_heavy]
put_weight = 7
get_weight = 2
delete_weight = 1
list_weight = 1

[scenarios.mixed]
put_weight = 3
get_weight = 5
delete_weight = 1
list_weight = 1

[reporting]
output_dir = "./loadtest-results"
prometheus_endpoint = "http://localhost:9000/metrics"
collect_system_metrics = true
