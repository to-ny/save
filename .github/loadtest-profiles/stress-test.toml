# Stress Test Profile
# High-intensity stress test to find performance limits
# Duration: 15 minutes, 200 concurrent users

[target]
endpoint = "http://localhost:9000"
access_key = "test-access-key"
secret_key = "test-secret-key"
bucket = "loadtest"

[workload]
duration_secs = 900

[workload.object_sizes]
small_1kb_percent = 30
medium_1mb_percent = 40
large_10mb_percent = 20
xlarge_100mb_percent = 10

[workload.users]
start = 10
max = 200
hatch_rate = 10

[scenarios.read_heavy]
put_weight = 1
get_weight = 8
delete_weight = 1
list_weight = 1

[scenarios.write_heavy]
put_weight = 7
get_weight = 2
delete_weight = 1
list_weight = 1

[scenarios.mixed]
put_weight = 3
get_weight = 5
delete_weight = 1
list_weight = 1

[reporting]
output_dir = "./loadtest-results"
prometheus_endpoint = "http://localhost:9000/metrics"
collect_system_metrics = true
