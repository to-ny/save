[package]
name = "save-loadtest"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loadtest"
path = "src/main.rs"

[[bin]]
name = "soaktest"
path = "src/bin/soaktest.rs"

[dependencies]
goose = { version = "0.18.1", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rand = "0.9.2"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
aws-sigv4 = "1.2"
http = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
