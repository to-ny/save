[package]
name = "save-loadtest"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "save_loadtest"
path = "src/lib.rs"

[features]
default = []
load_tests = []

[dependencies]
# Load testing framework (loadtest-specific)
goose = { version = "0.18.1", default-features = false, features = ["rustls-tls"] }

# System metrics (loadtest-specific)
sysinfo = "0.37.2"
num_cpus = "1.16"
sys-info = "0.9"
rustc_version_runtime = "0.3"

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
url = { workspace = true }
prometheus-parse = { workspace = true }
