# Smoke profile: 3-node cluster with minimal resources for local testing
# Suitable for Docker Desktop and CI environments
replicaCount: 3

image:
  repository: save
  tag: latest
  pullPolicy: Never

# Minimal resources to fit 3 nodes on Docker Desktop
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

server:
  workerThreads: 2
  maxBlockingThreads: 128

metadata:
  writeBufferSizeMb: 32
  maxWriteBufferNumber: 2
  blockCacheSizeMb: 64
  maxBackgroundJobs: 2

persistence:
  dataSize: 1Gi
  metadataSize: 500Mi

podDisruptionBudget:
  enabled: false

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 3

startupProbe:
  initialDelaySeconds: 2
  periodSeconds: 2
  failureThreshold: 60
