replicaCount: 3

image:
  repository: save
  tag: latest
  pullPolicy: Never

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

server:
  workerThreads: 4
  maxBlockingThreads: 512

metadata:
  writeBufferSizeMb: 128
  maxWriteBufferNumber: 4
  blockCacheSizeMb: 512
  maxBackgroundJobs: 4

persistence:
  dataSize: 50Gi
  metadataSize: 10Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
