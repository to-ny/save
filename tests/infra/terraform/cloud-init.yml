#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - curl
  - git

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker root
  - |
    cat > /etc/docker/daemon.json <<'EOF'
    {
      "log-driver": "json-file",
      "log-opts": {
        "max-size": "10m",
        "max-file": "3"
      }
    }
    EOF
  - systemctl restart docker
%{ if use_volume ~}
  - |
    DEVICE="/dev/disk/by-id/scsi-0HC_Volume_*"
    while [ ! -e $DEVICE ]; do
      echo "Waiting for volume device..."
      sleep 2
    done
    DEVICE=$(ls /dev/disk/by-id/scsi-0HC_Volume_* | head -1)
    mkfs.ext4 -F $DEVICE || true
    mkdir -p /var/lib/save
    mount $DEVICE /var/lib/save
    echo "$DEVICE /var/lib/save ext4 defaults,nofail 0 2" >> /etc/fstab
    mkdir -p /var/lib/save/data /var/lib/save/metadata
    chmod -R 777 /var/lib/save
%{ else ~}
  - mkdir -p /var/lib/save/data /var/lib/save/metadata
  - chmod -R 777 /var/lib/save
%{ endif ~}
  - mkdir -p /opt/save

write_files:
  - path: /opt/save/docker-compose.yml
    content: |
      ${docker_compose_yml}
    permissions: '0644'

  - path: /opt/save/prometheus.yml
    content: |
      ${prometheus_yml}
    permissions: '0644'

  - path: /opt/save/loki-config.yml
    content: |
      ${loki_config_yml}
    permissions: '0644'

  - path: /opt/save/promtail-config.yml
    content: |
      ${promtail_config_yml}
    permissions: '0644'

  - path: /opt/save/grafana-datasources.yml
    content: |
      ${grafana_datasources_yml}
    permissions: '0644'

  - path: /opt/save/save.toml
    content: |
      ${save_toml}
    permissions: '0644'

  - path: /opt/save/README.txt
    content: |
      ${readme_txt}
    permissions: '0644'
