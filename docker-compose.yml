services:
  save-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: save
    ports:
      - "9000:9000"
    volumes:
      - ./docker/save/save.toml:/app/save.toml:ro
      - save-data:/var/lib/save/data
      - save-metadata:/var/lib/save/metadata
    environment:
      - SAVE_CONFIG=/app/save.toml
      - RUST_LOG=save_api=info,save_storage=info,save_metadata=info
      - LOG_FORMAT=json
    labels:
      service: "save-api"
      environment: "docker-compose"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - save-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 256M

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - save-network
    restart: unless-stopped
    depends_on:
      save-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 128M

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana:12.1
    container_name: grafana
    profiles:
      - observability
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    networks:
      - save-network
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M

  # OpenObserve - Log aggregation and observability
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.20.3
    container_name: openobserve
    profiles:
      - observability
    ports:
      - "5080:5080"   # Web UI
      - "5081:5081"   # gRPC for ingestion
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=admin
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve-data:/data
    networks:
      - save-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 128M

  # Vector - Log shipping to OpenObserve
  # Note: Runs as root (user 0:0) to access Docker socket for log collection
  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: vector
    profiles:
      - observability
    user: "0:0"
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./docker/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - save-network
    restart: unless-stopped
    depends_on:
      - openobserve
      - save-api
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 32M

networks:
  save-network:
    driver: bridge

volumes:
  save-data:
  save-metadata:
  prometheus-data:
  grafana-data:
  openobserve-data:
