global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

# Stats page for monitoring HAProxy itself
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# Main S3 API frontend
frontend s3_api
    bind *:9000
    default_backend save_nodes

# Backend with all Save nodes
backend save_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # Health check settings
    default-server inter 3s fall 3 rise 2

    server save-node1 save-node1:9000 check
    server save-node2 save-node2:9000 check
    server save-node3 save-node3:9000 check
