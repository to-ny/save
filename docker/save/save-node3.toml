[server]
bind_address = "0.0.0.0:9000"
worker_threads = 4
max_blocking_threads = 512
bucket_cache_ttl_secs = 60

[storage]
data_path = "/var/lib/save/data"
metadata_path = "/var/lib/save/metadata"
fsync_mode = "data"
gc_interval_secs = 300
gc_temp_file_max_age_secs = 3600

[metadata]
write_buffer_size_mb = 128
max_write_buffer_number = 4
block_cache_size_mb = 256
max_background_jobs = 4

[shutdown]
drain_timeout_secs = 30

[credentials]
access_key = "test-access-key"
secret_key = "test-secret-key"

[cluster]
node_id = 3
raft_bind_addr = "0.0.0.0:9001"
peers = ["1:save-node1:9001:9000", "2:save-node2:9001:9000"]

[cluster.replication]
replication_factor = 3
bind_addr = "0.0.0.0:9002"
