global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'save-dev'
    replica: '0'

# Load alerting rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Scrape configurations
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'save'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['save:9000']
        labels:
          service: 'save-object-storage'
          env: 'dev'
