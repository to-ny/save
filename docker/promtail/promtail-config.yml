server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers in the save-network
      - source_labels: ['__meta_docker_network_name']
        regex: 'save-network'
        action: keep

      # Add container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Add container ID as label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Add service label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/save.*'
        target_label: 'service'
        replacement: 'save-api'

      - source_labels: ['__meta_docker_container_name']
        regex: '/prometheus'
        target_label: 'service'
        replacement: 'prometheus'

      - source_labels: ['__meta_docker_container_name']
        regex: '/grafana'
        target_label: 'service'
        replacement: 'grafana'

      - source_labels: ['__meta_docker_container_name']
        regex: '/alertmanager'
        target_label: 'service'
        replacement: 'alertmanager'

      # Add environment label
      - target_label: 'environment'
        replacement: 'production'

    # Parse JSON logs for save-api
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            target: target

      # Set timestamp from log if available
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Extract log level
      - labels:
          level:

      # Output structured message
      - output:
          source: message
