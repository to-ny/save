# 3-node cluster setup for testing distributed features
# Usage: docker-compose -f docker-compose.cluster.yml up -d
# With observability: docker-compose -f docker-compose.cluster.yml --profile observability up -d

services:
  # ==========================================================================
  # Save Cluster Nodes
  # ==========================================================================
  save-node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: save-node1
    volumes:
      - ./docker/save/save-node1.toml:/app/save.toml:ro
      - save-node1-data:/var/lib/save/data
      - save-node1-metadata:/var/lib/save/metadata
    environment:
      - SAVE_CONFIG=/app/save.toml
      - RUST_LOG=save_api=info,save_storage=info,save_metadata=info
      - LOG_FORMAT=json
    labels:
      service: "save-node1"
      cluster: "save-cluster"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - save-cluster-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M

  save-node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: save-node2
    volumes:
      - ./docker/save/save-node2.toml:/app/save.toml:ro
      - save-node2-data:/var/lib/save/data
      - save-node2-metadata:/var/lib/save/metadata
    environment:
      - SAVE_CONFIG=/app/save.toml
      - RUST_LOG=save_api=info,save_storage=info,save_metadata=info
      - LOG_FORMAT=json
    labels:
      service: "save-node2"
      cluster: "save-cluster"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - save-cluster-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M

  save-node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: save-node3
    volumes:
      - ./docker/save/save-node3.toml:/app/save.toml:ro
      - save-node3-data:/var/lib/save/data
      - save-node3-metadata:/var/lib/save/metadata
    environment:
      - SAVE_CONFIG=/app/save.toml
      - RUST_LOG=save_api=info,save_storage=info,save_metadata=info
      - LOG_FORMAT=json
    labels:
      service: "save-node3"
      cluster: "save-cluster"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - save-cluster-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M

  # ==========================================================================
  # Cluster Initialization
  # ==========================================================================
  cluster-init:
    image: curlimages/curl:8.11.0
    container_name: cluster-init
    depends_on:
      save-node1:
        condition: service_healthy
      save-node2:
        condition: service_healthy
      save-node3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting 5 seconds for all nodes to be ready..."
        sleep 5

        echo "Initializing cluster..."
        curl -sf -X POST http://save-node1:9000/cluster/initialize \
          -H "Content-Type: application/json" \
          -d '{
            "members": [
              "1:save-node1:9001",
              "2:save-node2:9001",
              "3:save-node3:9001"
            ]
          }' && echo "Cluster initialized successfully" || echo "Cluster may already be initialized"

        echo "Checking cluster status in 3 seconds..."
        sleep 3
        curl -sf http://save-node1:9000/cluster/status | head -c 500
        echo ""
        echo "Cluster init complete"
    networks:
      - save-cluster-network
    restart: "no"

  # ==========================================================================
  # Load Balancer
  # ==========================================================================
  haproxy:
    image: haproxy:3.3-alpine
    container_name: save-lb
    ports:
      - "9000:9000"
      - "8404:8404"  # HAProxy stats
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      save-node1:
        condition: service_healthy
      save-node2:
        condition: service_healthy
      save-node3:
        condition: service_healthy
    networks:
      - save-cluster-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ==========================================================================
  # Observability Stack (optional, use --profile observability)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-cluster.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-cluster-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - save-cluster-network
    restart: unless-stopped
    depends_on:
      - save-node1
      - save-node2
      - save-node3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  grafana:
    image: grafana/grafana:12.1
    container_name: grafana
    profiles:
      - observability
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-cluster-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - save-cluster-network
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.20.3
    container_name: openobserve
    profiles:
      - observability
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=admin
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve-cluster-data:/data
    networks:
      - save-cluster-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: vector
    profiles:
      - observability
    user: "0:0"
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./docker/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - save-cluster-network
    restart: unless-stopped
    depends_on:
      - openobserve
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

networks:
  save-cluster-network:
    driver: bridge

volumes:
  # Node data volumes
  save-node1-data:
  save-node1-metadata:
  save-node2-data:
  save-node2-metadata:
  save-node3-data:
  save-node3-metadata:
  # Observability volumes
  prometheus-cluster-data:
  grafana-cluster-data:
  openobserve-cluster-data:
