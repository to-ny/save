[workspace]
resolver = "2"
members = [
    "crates/save-api",
    "crates/save-storage",
    "crates/save-metadata",
    "crates/save-common",
    "tests/aws-sdk-compat",
    "tests/aws-cli-compat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Save Contributors"]
license = "Apache-2.0"
repository = "https://github.com/yourusername/save"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Web framework
axum = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
quick-xml = { version = "0.38.3", features = ["serialize"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
base64 = "0.22"

# Database
rocksdb = "0.24.0"
bincode = { version = "2.0.1", features = ["serde"] }

# Time
chrono = { version = "0.4.42", features = ["serde"] }

# Metrics
prometheus = { version = "0.14.0", default-features = false }

# Testing
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.14"
