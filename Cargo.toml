[workspace]
resolver = "2"
members = [
    "crates/save-api",
    "crates/save-storage",
    "crates/save-metadata",
    "crates/save-common",
    "crates/save-cli",
    "crates/save-proto",
    "tests/aws-sdk-compat",
    "tests/aws-cli-compat",
    "tests/concurrency",
    "tests/crash-recovery",
    "tests/loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["to-ny"]
license = "Apache-2.0"
repository = "https://github.com/to-ny/save"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Web framework
axum = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
quick-xml = { version = "0.38.3", features = ["serialize"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
base64 = "0.22"

# Database
rocksdb = "0.24.0"
bincode = { version = "2.0.1", features = ["serde"] }

# Compression and archiving
flate2 = "1.1"
tar = "0.4"

# Cluster & Replication
openraft = { version = "0.9", features = ["serde"] }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
prost = "0.14"
tonic-build = "0.14"

# Time
chrono = { version = "0.4.42", features = ["serde"] }

# Metrics
prometheus = { version = "0.14.0", default-features = false }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# URL parsing
url = { version = "2.5", features = ["serde"] }

# Configuration
config = "0.15.19"

# Cryptographic utilities
hex = "0.4"
hmac = "0.12"

# Random number generation
rand = "0.9"

# Prometheus parsing
prometheus-parse = "0.2"

# Testing
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.14"
fail = "0.5"
nix = { version = "0.30.1", features = ["signal", "process", "fs"] }
async-trait = "0.1"
criterion = { version = "0.7", features = ["html_reports", "async_tokio"] }

# AWS SDK (for CLI and tests)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# Concurrent data structures
dashmap = "6.1"

# Socket utilities
socket2 = "0.5"
