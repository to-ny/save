# Development values for Save distributed object store
# Usage: helm install save ./charts/save -f charts/save/values-development.yaml
#
# This configuration is suitable for:
# - Local development (minikube, kind, Docker Desktop)
# - CI/CD testing
# - Quick demos and evaluations
#
# NOT suitable for production use!

# Minimal cluster for development
replicaCount: 3

# Development credentials (DO NOT USE IN PRODUCTION)
auth:
  accessKey: "dev-access-key"
  secretKey: "dev-secret-key"

# Minimal storage for local development
persistence:
  enabled: true
  storageClass: ""
  dataSize: 1Gi
  metadataSize: 500Mi

# Minimal resources for local environments
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Reduced performance settings
server:
  workerThreads: 2
  maxBlockingThreads: 128

metadata:
  writeBufferSizeMb: 64
  maxWriteBufferNumber: 2
  blockCacheSizeMb: 128
  maxBackgroundJobs: 2

# Disable advanced features for simplicity
metrics:
  enabled: true
  serviceMonitor:
    enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

tls:
  enabled: false

# Faster probes for development feedback
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 3
  timeoutSeconds: 2

startupProbe:
  initialDelaySeconds: 2
  periodSeconds: 2
  failureThreshold: 30

# Shorter shutdown for faster iteration
terminationGracePeriodSeconds: 30

shutdown:
  drainTimeoutSecs: 15

# Cluster init with fewer retries
clusterInit:
  backoffLimit: 5
  ttlSecondsAfterFinished: 60

# Allow scheduling multiple pods on same node
affinity: {}
