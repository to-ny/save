{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "save.fullname" . }}
  {{- if .Values.prometheusRule.namespace }}
  namespace: {{ .Values.prometheusRule.namespace }}
  {{- end }}
  labels:
    {{- include "save.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.prometheusRule.defaultRules }}
    - name: save.alerts
      interval: 30s
      rules:
        # Request/Response Alerts
        - alert: SaveHighErrorRate
          expr: |
            (
              sum(rate(save_http_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(save_http_requests_total[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "High error rate detected in Save cluster"
            description: "Error rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold: 5%)"

        - alert: SaveSlowResponseTime
          expr: |
            histogram_quantile(0.99,
              rate(save_http_request_duration_seconds_bucket[5m])
            ) > 5
          for: 10m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Slow p99 response time in Save cluster"
            description: "p99 latency is {{ "{{" }} $value | humanizeDuration {{ "}}" }} (threshold: 5s)"

        # Storage Alerts
        - alert: SaveDiskSpaceLow
          expr: |
            (
              save_disk_usage_bytes{type="available"}
              /
              save_disk_usage_bytes{type="total"}
            ) < 0.10
          for: 5m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "Low disk space on Save node"
            description: "Only {{ "{{" }} $value | humanizePercentage {{ "}}" }} disk space remaining"

        - alert: SaveDiskSpaceCritical
          expr: |
            (
              save_disk_usage_bytes{type="available"}
              /
              save_disk_usage_bytes{type="total"}
            ) < 0.05
          for: 2m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: "Critical disk space on Save node"
            description: "Only {{ "{{" }} $value | humanizePercentage {{ "}}" }} disk space remaining"

        # System Health Alerts
        - alert: SaveNodeDown
          expr: up{job=~".*save.*"} == 0
          for: 1m
          labels:
            severity: critical
            component: system
          annotations:
            summary: "Save node is down"
            description: "Node {{ "{{" }} $labels.instance {{ "}}" }} is not responding"

        - alert: SaveHighInFlightRequests
          expr: save_in_flight_requests > 500
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "High number of in-flight requests"
            description: "{{ "{{" }} $value {{ "}}" }} requests currently in flight"

        # RocksDB Alerts
        - alert: SaveRocksDBLowCacheHitRate
          expr: |
            (
              rate(save_rocksdb_stats{stat="block_cache_hits"}[5m])
              /
              (
                rate(save_rocksdb_stats{stat="block_cache_hits"}[5m])
                +
                rate(save_rocksdb_stats{stat="block_cache_misses"}[5m])
              )
            ) < 0.80
          for: 10m
          labels:
            severity: warning
            component: rocksdb
          annotations:
            summary: "Low RocksDB cache hit rate"
            description: "Cache hit rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }}"

        # Cluster Health
        - alert: SaveQuorumLost
          expr: |
            count(up{job=~".*save.*"} == 1) < ({{ .Values.replicaCount }} / 2 + 1)
          for: 1m
          labels:
            severity: critical
            component: cluster
          annotations:
            summary: "Save cluster has lost quorum"
            description: "Less than majority of nodes are healthy"

        - alert: SaveClusterDegraded
          expr: |
            count(up{job=~".*save.*"} == 1) < {{ .Values.replicaCount }}
          for: 5m
          labels:
            severity: warning
            component: cluster
          annotations:
            summary: "Save cluster is degraded"
            description: "Not all {{ .Values.replicaCount }} nodes are healthy"
    {{- end }}
{{- end }}
