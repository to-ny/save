{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "save.fullname" . }}-credentials
  labels:
    {{- include "save.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.auth.accessKey .Values.auth.secretKey }}
  access-key: {{ .Values.auth.accessKey | b64enc | quote }}
  secret-key: {{ .Values.auth.secretKey | b64enc | quote }}
  {{- else }}
  # WARNING: Auto-generated credentials for development only
  # Use auth.existingSecret in production!
  access-key: {{ randAlphaNum 20 | b64enc | quote }}
  secret-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}
