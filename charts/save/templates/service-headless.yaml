apiVersion: v1
kind: Service
metadata:
  name: {{ include "save.headlessServiceName" . }}
  labels:
    {{- include "save.labels" . | nindent 4 }}
  {{- with .Values.headlessService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
    - name: raft
      port: 9001
      targetPort: raft
      protocol: TCP
    - name: replication
      port: 9002
      targetPort: replication
      protocol: TCP
  selector:
    {{- include "save.selectorLabels" . | nindent 4 }}
