apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "save.configMapName" . }}
  labels:
    {{- include "save.labels" . | nindent 4 }}
data:
  save.toml.tpl: |
    # Save configuration - generated by Helm
    # Node ID and peers are substituted at pod startup

    [server]
    bind_address = "0.0.0.0:{{ .Values.ports.http }}"
    worker_threads = {{ .Values.server.workerThreads }}
    max_blocking_threads = {{ .Values.server.maxBlockingThreads }}
    bucket_cache_ttl_secs = {{ .Values.server.bucketCacheTtlSecs }}

    [storage]
    data_path = "/var/lib/save/data"
    metadata_path = "/var/lib/save/metadata"
    fsync_mode = {{ .Values.storage.fsyncMode | quote }}
    gc_interval_secs = {{ .Values.storage.gcIntervalSecs }}
    gc_temp_file_max_age_secs = {{ .Values.storage.gcTempFileMaxAgeSecs }}

    [metadata]
    write_buffer_size_mb = {{ .Values.metadata.writeBufferSizeMb }}
    max_write_buffer_number = {{ .Values.metadata.maxWriteBufferNumber }}
    block_cache_size_mb = {{ .Values.metadata.blockCacheSizeMb }}
    max_background_jobs = {{ .Values.metadata.maxBackgroundJobs }}

    [shutdown]
    drain_timeout_secs = {{ .Values.shutdown.drainTimeoutSecs }}

    [credentials]
    access_key = "${ACCESS_KEY}"
    secret_key = "${SECRET_KEY}"

    [cluster]
    # NODE_ID is substituted by init container based on pod ordinal
    node_id = ${NODE_ID}
    raft_bind_addr = "0.0.0.0:{{ .Values.ports.raft }}"
    # SEED_NODES for initial discovery (substituted by init container, excludes self)
    seed_nodes = [${SEED_NODES}]

    [cluster.replication]
    replication_factor = {{ .Values.cluster.replicationFactor }}
    bind_addr = "0.0.0.0:{{ .Values.ports.replication }}"
    {{- if .Values.tls.enabled }}

    [cluster.replication.tls]
    cert_path = "/certs/tls.crt"
    key_path = "/certs/tls.key"
    ca_cert_path = "/certs/ca.crt"
    {{- end }}
