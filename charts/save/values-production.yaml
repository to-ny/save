# Production values for Save distributed object store
# Usage: helm install save ./charts/save -f charts/save/values-production.yaml
#
# IMPORTANT: Before deploying to production, you MUST:
# 1. Create a secret with S3 credentials:
#    kubectl create secret generic save-credentials \
#      --from-literal=access-key=YOUR_ACCESS_KEY \
#      --from-literal=secret-key=YOUR_SECRET_KEY
# 2. Update auth.existingSecret below to reference your secret
# 3. Ensure cert-manager is installed for automated TLS certificate management

# =============================================================================
# Cluster Configuration
# =============================================================================

# Production cluster sizing (3 nodes minimum for quorum)
replicaCount: 3

# REQUIRED: Reference your pre-created credentials secret
auth:
  existingSecret: "save-credentials"

# =============================================================================
# Storage Configuration
# =============================================================================

# Maximum durability: fsync all writes
storage:
  fsyncMode: "all"
  gcIntervalSecs: 300
  gcTempFileMaxAgeSecs: 3600

persistence:
  enabled: true
  # Use a production-grade storage class (e.g., gp3, premium-rwo)
  storageClass: ""
  dataSize: 100Gi
  metadataSize: 20Gi

# =============================================================================
# Resource Allocation
# =============================================================================

resources:
  requests:
    memory: "2Gi"
    cpu: "1"
  limits:
    memory: "8Gi"
    cpu: "4"

# Performance tuning for production workloads
server:
  workerThreads: 8
  maxBlockingThreads: 1024

metadata:
  writeBufferSizeMb: 256
  maxWriteBufferNumber: 6
  blockCacheSizeMb: 512
  maxBackgroundJobs: 8

# =============================================================================
# Security - mTLS with cert-manager
# =============================================================================

tls:
  enabled: true
  certManager:
    enabled: true
    duration: 2160h    # 90 days
    renewBefore: 720h  # 30 days
    createSelfSignedIssuer: true
    issuerKind: ClusterIssuer
    privateKey:
      algorithm: ECDSA
      size: 256

# Network isolation
networkPolicy:
  enabled: true

# =============================================================================
# Observability
# =============================================================================

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: prometheus

# Enable Prometheus alerting rules
prometheusRule:
  enabled: true
  defaultRules: true
  labels:
    release: prometheus

# Enable Grafana dashboards
grafana:
  dashboards:
    enabled: true

# =============================================================================
# High Availability
# =============================================================================

# Pod disruption budget - always maintain quorum
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread pods across nodes and zones (hard requirement for nodes, soft for zones)
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: save
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: save
          topologyKey: topology.kubernetes.io/zone

# Even distribution across zones
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: save

# =============================================================================
# Graceful Shutdown
# =============================================================================

# Longer termination grace period for production
terminationGracePeriodSeconds: 120

shutdown:
  drainTimeoutSecs: 90

# =============================================================================
# Health Checks
# =============================================================================

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 60
