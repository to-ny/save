{{- if .Values.openobserve.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openobserve
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: log-aggregation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: openobserve
          image: "{{ .Values.openobserve.image.repository }}:{{ .Values.openobserve.image.tag }}"
          imagePullPolicy: {{ .Values.openobserve.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5080
              protocol: TCP
          env:
            - name: ZO_ROOT_USER_EMAIL
              value: {{ .Values.openobserve.auth.rootUser | quote }}
            - name: ZO_ROOT_USER_PASSWORD
              value: {{ .Values.openobserve.auth.rootPassword | quote }}
            - name: ZO_DATA_DIR
              value: /data
          {{- if .Values.openobserve.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.openobserve.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if .Values.openobserve.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-openobserve-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openobserve
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.openobserve.service.type }}
  ports:
    - port: {{ .Values.openobserve.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.openobserve.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-openobserve-data
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.openobserve.persistence.size }}
  {{- if .Values.openobserve.persistence.storageClass }}
  storageClassName: {{ .Values.openobserve.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
