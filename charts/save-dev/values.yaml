# Save Development Environment Values
# This configures the full observability stack for development use.

# ============================================================================
# Main Save Chart Configuration
# ============================================================================
save:
  replicaCount: 3

  config:
    server:
      # Ports: HTTP (9000), Raft (9001), Replication (9002)
      metrics_interval_secs: 15

    cluster:
      enabled: true
      auto_join: true
      graceful_leave: true

# ============================================================================
# OpenObserve - Log aggregation and search
# ============================================================================
openobserve:
  enabled: true
  image:
    repository: public.ecr.aws/zinclabs/openobserve
    tag: "v0.10.0"
    pullPolicy: IfNotPresent

  # Default admin credentials (development only!)
  auth:
    rootUser: "admin@example.com"
    rootPassword: "admin"

  service:
    type: ClusterIP
    port: 5080

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: false
    # For persistent storage, enable and configure:
    # enabled: true
    # size: 10Gi
    # storageClass: ""

# ============================================================================
# Vector - Log collection and routing
# ============================================================================
vector:
  enabled: true
  image:
    repository: timberio/vector
    tag: "0.34.1-debian"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================================================
# Prometheus - Metrics collection
# ============================================================================
prometheus:
  enabled: true

  # Disable components we don't need for development
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  server:
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Scrape save metrics
    extraScrapeConfigs:
      - job_name: 'save'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: save
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9000"
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

    # Load alert rules from ConfigMap
    alertingRules:
      enabled: true

# ============================================================================
# Grafana - Dashboards and visualization
# ============================================================================
grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  persistence:
    enabled: false

  # Enable sidecar for dashboards (watches ConfigMaps with label grafana_dashboard=1)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: false
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
